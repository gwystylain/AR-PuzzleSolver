# TrueNAS custom app: the Spellinator lobby server. Apps → Discover Apps → Custom App →
# Install via YAML, and paste this in. Before installing, csw24.txt must be in the dataset
# below, readable by the apps user (568) -- see docs/SPELLINATOR.md, "Deploying it".
#
# Only the word list is mounted, read-only: the server keeps no state on disk, and its
# lobbies live in memory, so an update or restart closes them (the phones say so).
# Behind the reverse proxy, SPELL_TRUST_FORWARDED lets the per-address connection limit
# see the client's address rather than the proxy's. Port 8422 sits near the activate
# tracker's 8420; change the left side if it is taken, and point the proxy at it.
services:
  spellinator:
    cap_drop:
      - ALL
    container_name: spellinator
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
    environment:
      SPELL_DICTIONARY: /data/csw24.txt
      SPELL_TRUST_FORWARDED: 'true'
    image: ghcr.io/gwystylain/puzzlesolver-spell-server:latest
    ports:
      - '8422:8080'
    pull_policy: always
    read_only: True
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: '568:568'
    volumes:
      - >-
        /mnt/SSD/ApplicationsDataset/ActivateAppServer/csw24.txt:/data/csw24.txt:ro
