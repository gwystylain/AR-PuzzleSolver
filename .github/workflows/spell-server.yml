# Builds the Spellinator lobby server and publishes its image to GHCR:
#
#     ghcr.io/gwystylain/puzzlesolver-spell-server:latest   (newest main)
#     ghcr.io/gwystylain/puzzlesolver-spell-server:sha-abc1234
#
# TrueNAS pulls :latest (spell-server/truenas.yaml). The image carries no word list -- that
# is mounted on the NAS -- so it is safe to make public; see docs/SPELLINATOR.md.
name: Spellinator server image

on:
  push:
    branches: [main]
    paths:
      - "spell/**"
      - "spell-client/**"
      - "spell-server/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/spell-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: spell-server-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gwystylain/puzzlesolver-spell-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The end-to-end tests run the real server against the phone's own connection code,
      # through a proxy that drops and stalls connections.
      - name: Test and build the server
        run: ./gradlew :spell:test :spell-client:test :spell-server:test :spell-server:installDist --stacktrace

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: spell-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
