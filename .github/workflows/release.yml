# Builds a signed release APK and publishes it to a GitHub Release.
#
# Triggered by pushing a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The APK is attached to the release, so the "download the latest version" link
# in the README (releases/latest) always resolves to the newest build.
name: Release APK

on:
  push:
    tags: ["v*"]
  # Lets you produce a build from the Actions tab without cutting a tag. The
  # release step is skipped for these -- the APK lands as a workflow artifact.
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --stacktrace

      # The keystore is held as a base64 secret and written to a file that lives
      # only for this job, on an ephemeral runner. RUNNER_TEMP is outside the
      # workspace, so it can never be picked up by a later step or archived.
      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set. See docs/RELEASING.md for how to create the keystore and add the four repo secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # Unsigned build for manual runs, so the workflow is still exercisable
      # end to end without handing it the signing key.
      - name: Build unsigned release APK (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # Name the file after the tag so downloads are self-identifying rather than
      # eight copies of app-release.apk in a downloads folder.
      - name: Stage APK
        id: stage
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then echo "::error::no APK produced"; exit 1; fi
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(git rev-parse --short HEAD)"
          name="PuzzleSolver-${version}.apk"
          cp "$apk" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Built $name ($(du -h "$name" | cut -f1))"

      - name: Verify APK signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "${{ steps.stage.outputs.name }}"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.stage.outputs.name }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
